name: Supabase keepalive

# Il piano gratuito Supabase va in pausa automatica dopo 7 giorni senza
# attivita'. Ogni giorno questo job fa due cose: una lettura e, soprattutto,
# una piccola scrittura vera (la funzione keepalive_ping, vedi migrazione
# 0006), che conta come attivita' sul database. Se un tentativo fallisce
# ne prova altri 5, a distanza di un minuto. La chiave usata e' quella
# "publishable", pensata per essere pubblica (e' la stessa gia' visibile
# nel codice del sito).
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Lettura
        run: |
          curl --fail-with-body --silent --show-error --max-time 30 \
            --retry 5 --retry-delay 60 --retry-all-errors \
            "https://gshveukvqrpaarncviop.supabase.co/rest/v1/site_content?select=key&limit=1" \
            -H "apikey: sb_publishable_urcPSspANw1kQSoqyymeZA_1jr_ZZLi" \
            -H "Authorization: Bearer sb_publishable_urcPSspANw1kQSoqyymeZA_1jr_ZZLi"

      - name: Scrittura (keepalive_ping)
        run: |
          curl --fail-with-body --silent --show-error --max-time 30 \
            --retry 5 --retry-delay 60 --retry-all-errors \
            -X POST \
            "https://gshveukvqrpaarncviop.supabase.co/rest/v1/rpc/keepalive_ping" \
            -H "apikey: sb_publishable_urcPSspANw1kQSoqyymeZA_1jr_ZZLi" \
            -H "Authorization: Bearer sb_publishable_urcPSspANw1kQSoqyymeZA_1jr_ZZLi" \
            -H "Content-Type: application/json" \
            -d '{}'
